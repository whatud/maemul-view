<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>매물 모아보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#F5F6F8;--card:#fff;--ink:#191F28;--sub:#4E5968;--mute:#8B95A1;--line:#E5E8EB;--accent:#1B64DA;--accent-soft:#E8F0FD;--new:#0A7D4F;--new-soft:#E3F5EC;--drop:#B4541A;--drop-soft:#FDF0E6;--rec:#8A5A00;--rec-soft:#FFF1C9;--rec-line:#E8B323;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
header h1{font-size:26px;margin:0 0 4px;letter-spacing:-0.02em}
.meta{color:var(--sub);font-size:14px}
.err{margin-top:10px;padding:10px 14px;background:var(--drop-soft);color:var(--drop);border-radius:10px;font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 14px}
.stat{background:var(--card);border-radius:12px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--sub);font-size:13px}
.stat{border:2px solid transparent;cursor:pointer;font:inherit;text-align:left;color:inherit;transition:border-color .15s,background .15s}
.stat:hover{border-color:var(--line)}
.stat.on{border-color:var(--accent);background:var(--accent-soft)}
.stat.on b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.7;margin-left:4px}
select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:8px}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.ph{position:relative;aspect-ratio:4/3;background:#e9ecef;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
.dep{display:inline-block;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;margin-bottom:2px}
.dep.lo{background:#FFD43B;color:#4A3500}
.dep.hi{background:#1FA463;color:#fff}
.card.dlo .body{border-top:5px solid #FFD43B}
.card.dhi .body{border-top:5px solid #1FA463}
.dep-legend{background:rgba(255,255,255,.95);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.2);font-family:"Pretendard Variable",Pretendard,sans-serif}
.dep-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.pet{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.pet.no{background:#EEF0F3;color:#4E5968}
.pet.yes{background:#E8F0FD;color:#1B64DA}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.pet.kind{background:#F2F4F6;color:#333D4B}
.pet.warn{background:#FFF4E5;color:#B45309}
.bd{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.bd.new{background:var(--new-soft);color:var(--new)}
.bd.drop{background:var(--drop-soft);color:var(--drop)}
.bd.rec{background:#fff;color:#191F28;font-size:13px;padding:3px 10px 3px 7px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.bd.rec .rs{color:#FFB800;font-size:16px;margin-right:3px;text-shadow:0 0 1px #8A5A00}
.card.rec{}
.why{font-size:13px;font-weight:700;color:var(--rec);background:var(--rec-soft);border-radius:6px;padding:3px 8px;align-self:flex-start}
.bd.south{background:var(--rec-soft);color:var(--rec)}
.three{position:absolute;right:8px;top:8px;background:#FFE3EC;color:#C2255C;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(194,37,92,.25);animation:wiggle 2.4s ease-in-out infinite}
.three b{color:#F5B400;font-size:15px;margin-right:3px;text-shadow:0 0 1px #C2255C}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-8deg)}94%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.three{animation:none}}
.star-pin{background:none;border:0}
.zz-pin{background:none;border:0}
.zz-pin span{display:block;transform:translate(-50%,-52%);color:#F04452;line-height:1;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 1px #fff}
.star-pin span{display:block;transform:translate(7px,-27px);color:#FFC61A;font-size:26px;line-height:1;text-shadow:0 0 2px #C2255C,0 0 2px #C2255C}
.chip.rec-on{background:var(--rec-line);border-color:var(--rec-line);color:#3D2800}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{font-size:20px;font-weight:800;letter-spacing:-0.01em}
.price .pl{font-size:16px;font-weight:800;color:var(--accent);margin-right:8px;letter-spacing:-0.02em}
.price small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.was{font-size:13px;color:var(--drop)}
.spec{color:var(--sub);font-size:14px}
.ttl{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc{font-size:13px;color:var(--mute)}
.agent{font-size:13px;color:var(--mute);margin-top:2px}
.agent a{color:var(--accent);text-decoration:none;font-weight:600}
.links{display:flex;gap:6px;margin-top:auto;padding-top:10px}
.links a{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:600;padding:8px 0;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.zz{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:0 1px 5px rgba(0,0,0,.3);font-size:20px;line-height:38px;text-align:center;color:#B0B8C1;cursor:pointer;padding:0}
.zz.on{color:#F04452}
.chip.zz-chip.on{background:#F04452;border-color:#F04452;color:#fff}
.card.gone{opacity:.6}
.gone-tag{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;background:rgba(25,31,40,.8);color:#fff;font-weight:700;font-size:14px;padding:8px 0}
.geo{display:flex;gap:6px;margin-top:6px}
.geo a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:700;padding:7px 0;border-radius:9px;border:1px solid var(--line);background:#fff}
.geo a.nv{color:#03A94D}
.geo a.rv{color:#3B4BB8}
.empty{padding:50px 0;text-align:center;color:var(--sub)}
#map{height:620px;border-radius:14px;margin-top:8px;display:none;border:1px solid var(--line)}
.pop{font-family:inherit;font-size:13px;line-height:1.45}
.pop b{font-size:15px}
.pop a{color:var(--accent)}
.pzz{margin-top:8px;width:100%;padding:7px 0;border-radius:8px;border:1px solid #F04452;background:#fff;color:#F04452;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.pzz.on{background:#F04452;color:#fff}
.hd{position:absolute;left:8px;bottom:8px;height:30px;padding:0 11px;border-radius:999px;border:0;background:rgba(25,31,40,.72);color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.hd.un{background:#1B64DA}
.phd{margin-top:6px;width:100%;padding:7px 0;border-radius:8px;border:1px solid #8B95A1;background:#fff;color:#4E5968;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.chip.hd-chip.on{background:#4E5968;border-color:#4E5968;color:#fff}
.st-label{background:none;border:0}
.st-label span{display:inline-block;transform:translate(-50%,-150%);white-space:nowrap;background:#0B3D91;color:#fff;font-weight:800;font-size:16px;padding:5px 11px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:"Pretendard Variable",Pretendard,sans-serif}
.st-label.below span{transform:translate(-50%,40%)}
.sw-label{background:none;border:0}
.sw-label span{display:inline-block;transform:translate(6px,-50%);white-space:nowrap;font-size:13px;font-weight:700;color:#191F28;font-family:"Pretendard Variable",Pretendard,sans-serif;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
#map.z-far .sw-label{display:none}
#map.z-mid .sw-label span{font-size:11px}
.legend{background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.2);display:grid;grid-template-columns:auto auto;column-gap:12px;font-family:"Pretendard Variable",Pretendard,sans-serif}
.legend div{white-space:nowrap}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
@media (max-width:600px){.legend{font-size:10px;line-height:1.5;padding:5px 7px;column-gap:8px}.legend i{width:12px;height:4px;margin-right:4px}}
.school-pin{background:none;border:0}
.school-pin div{display:flex;align-items:center;gap:3px;transform:translate(-11px,-11px);white-space:nowrap;pointer-events:none}
.school-pin b{display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;border-radius:50%;background:#fff;border:1.5px solid #C25E00;font-size:13px;line-height:1;font-weight:400;box-shadow:0 1px 2px rgba(0,0,0,.3);font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.school-pin span{font-size:11px;font-weight:700;color:#7A3E00;font-family:"Pretendard Variable",Pretendard,sans-serif;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
#map.school-off .school-pin{display:none}
#map.school-far .school-pin span{display:none}
.note{margin-top:22px;color:var(--mute);font-size:13px}
.chip.zero{opacity:.45}
.fresh-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2000;border:0;border-radius:999px;background:#191F28;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:12px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;max-width:calc(100% - 32px)}
.tools .chip{margin-left:0}
/* 지도: 노선 범례는 접어 두고 버튼으로 펼친다. 말풍선이 뜨면 범례를 숨겨 가리지 않게 */
.legend-btn{background:rgba(255,255,255,.95);border:0;border-radius:10px;padding:7px 11px;font:inherit;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;display:block;margin-left:auto}
.legend{display:none;margin-top:6px}
.legend.open{display:grid}
#map.pop-open .legend,#map.pop-open .legend-btn,#map.pop-open .dep-legend{display:none}
#map.z-far .leaflet-stations-pane{display:none}
/* 휴대폰: 첫 화면에 매물이 바로 보이도록 위쪽을 압축 */
@media (max-width:600px){
  .wrap{padding-left:16px;padding-right:16px}
  header h1{font-size:22px}
  .meta{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .meta.open{display:block}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{min-width:0;padding:8px 8px}
  .stat b{font-size:18px}
  .stat span{font-size:11px;word-break:keep-all;line-height:1.3;display:block}
  #areaBar,.bar.filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px 2px}
  #areaBar::-webkit-scrollbar,.bar.filters::-webkit-scrollbar{display:none}
  #areaBar .chip,.bar.filters .chip{flex:none;white-space:nowrap}
  .tools{flex-wrap:nowrap}
  .tools select{flex:1;min-width:0;height:40px}
  .tools .chip{flex:none;height:40px}
  .hd{height:36px;padding:0 13px}
  .dep-legend{font-size:10.5px;line-height:1.5;padding:4px 8px}
  .dep-legend i{width:9px;height:9px}
  #map{height:70vh}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>매물 모아보기</h1>
    <div class="meta" id="meta"></div>
    <div id="errs"></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar" id="areaBar"></div>
  <div class="bar filters">
    <button class="chip" id="fRec">추천만 (남향 또는 채광)</button>
    <button class="chip" id="fNew">신규 매물만 (3일 이내)</button>
    <button class="chip" id="fDrop">가격 내린 것만</button>
    <button class="chip" id="fBig">15평 이상 <span class="n" id="bigN">0</span></button>
    <button class="chip" id="fPet">반려동물 가능 <span class="n" id="petN">0</span></button>
    <button class="chip" id="fApt">아파트 <span class="n" id="aptN">0</span></button>
    <button class="chip" id="fDase">다세대 <span class="n" id="daseN">0</span></button>
    <button class="chip" id="fDaga">다가구 <span class="n" id="dagaN">0</span></button>
    <button class="chip zz-chip" id="fZz">♥ 찜한 것만 <span class="n" id="zzN">0</span></button>
    <button class="chip hd-chip" id="fHd">숨긴 매물 <span class="n" id="hdN">0</span></button>
  </div>
  <div class="bar tools">
    <select id="sort">
      <option value="rec">추천 먼저, 그다음 월 부담 낮은 순</option>
      <option value="total">관리비 포함 월 부담 낮은 순</option>
      <option value="rent">월세 낮은 순</option>
      <option value="deposit">보증금 낮은 순</option>
      <option value="area">면적 넓은 순</option>
      <option value="first">새로 본 순</option>
    </select>
    <button class="chip on" id="vCard">목록</button>
    <button class="chip" id="vMap">지도</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="err" id="mapNote" style="display:none">파일을 직접 열어서 확대하면 지도가 비어 보입니다. 바탕화면의 "매물 모아보기" 바로가기로 열면 자세한 지도가 나옵니다.</div>
  <div id="map"></div>
  <p class="note">직방·다방·네이버 자료를 개인 열람용으로 모은 것입니다. 계약 전에는 반드시 원본 매물과 중개사에게 확인하세요. 다방 위치는 사이트가 일부러 흐려 둔 좌표라 지도 핀이 실제와 수백 m 다를 수 있습니다.</p>
</div>
<script src="data/data.js"></script>
<script src="data/subway.js"></script>
<script src="data/school.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var D = window.MAEMUL;
  if(!D){document.getElementById('grid').innerHTML='<div class="empty">아직 수집한 자료가 없습니다. 바탕화면의 "매물 모아보기" 바로가기를 실행하세요.</div>';return;}
  var st = {area:'전체', onlyRec:false, onlyNew:false, onlyDrop:false, sort:'rec', view:'card', v:3};
  // v3 (10/16 조건 초기화): 예전 지역·버튼 선택은 버리고 정렬·보기 방식만 이어받는다
  try{ var saved = JSON.parse(localStorage.getItem('maemul-ui')||'{}'); if(saved.v!==3){ var keep = {}; if(saved.sort) keep.sort = saved.sort; if(saved.view) keep.view = saved.view; saved = keep; } Object.assign(st, saved); st.v=3; }catch(e){}
  function save(){ try{localStorage.setItem('maemul-ui', JSON.stringify(st));}catch(e){} }
  var ZZ = {};
  try{ ZZ = JSON.parse(localStorage.getItem('maemul-zzim')||'{}') || {}; }catch(e){ ZZ = {}; }
  // 찜은 브라우저와 PC 파일(data/찜.json) 두 곳에 저장한다. 브라우저 기록을 지워도 파일에서 되살린다.
  var zzReady = false;
  function postZz(){
    if(location.protocol==='file:' || !zzReady) return;
    fetch('/zzim', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(ZZ)}).catch(function(){});
  }
  function saveZz(){ try{localStorage.setItem('maemul-zzim', JSON.stringify(ZZ));}catch(e){} document.getElementById('zzN').textContent = Object.keys(ZZ).length; postZz(); }
  function loadZzFile(){
    if(location.protocol==='file:') return;
    fetch(encodeURI('data/찜.json') + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; }).then(function(f){
      f = (f && typeof f==='object') ? f : {};
      var add = 0;
      // 파일에만 있는 찜은 되살린다 (브라우저 기록이 지워진 경우)
      if(Object.keys(ZZ).length===0){ Object.keys(f).forEach(function(k){ ZZ[k]=f[k]; add++; }); }
      zzReady = true;
      saveZz();
      if(add) render();
    });
  }
  function toggleZz(id){
    if(ZZ[id]) delete ZZ[id];
    else { var x = items.filter(function(i){return i.id===id;})[0]; if(x) ZZ[id] = x; }
    saveZz();
    zzPin(id);
  }
  var ZP = {};
  function zzPin(id){
    var q = ZP[id]; if(!q || !layer) return;
    if(ZZ[id] && !q.m){
      q.m = L.marker([q.lat,q.lng],{interactive:false,keyboard:false,icon:L.divIcon({className:'zz-pin',html:'<span style="font-size:'+(q.rec?16:13)+'px">♥</span>',iconSize:null})}).addTo(layer);
    } else if(!ZZ[id] && q.m){ layer.removeLayer(q.m); q.m = null; }
  }
  // 숨긴 매물: 찜처럼 브라우저와 PC 파일(data/숨김.json) 두 곳에 저장. 숨기면 목록·지도에서 빠진다
  var HD = {};
  try{ HD = JSON.parse(localStorage.getItem('maemul-hidden')||'{}') || {}; }catch(e){ HD = {}; }
  var hdReady = false;
  function saveHd(){
    try{localStorage.setItem('maemul-hidden', JSON.stringify(HD));}catch(e){}
    if(location.protocol!=='file:' && hdReady) fetch('/hidden', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(HD)}).catch(function(){});
  }
  function loadHdFile(){
    if(location.protocol==='file:') return;
    fetch(encodeURI('data/숨김.json') + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; }).then(function(f){
      f = (f && typeof f==='object') ? f : {};
      var add = 0;
      if(Object.keys(HD).length===0){ Object.keys(f).forEach(function(k){ HD[k]=f[k]; add++; }); }
      hdReady = true; saveHd();
      if(add) render();
    });
  }
  function toggleHd(id){
    if(HD[id]) delete HD[id];
    else { var x = items.filter(function(i){return i.id===id;})[0]; HD[id] = x ? {dong:x.dong, deposit:x.deposit, rent:x.rent, title:x.title} : {}; }
    saveHd();
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function won(n){ if(n>=10000){var e=Math.floor(n/10000),r=n%10000;return e+'억'+(r?' '+r.toLocaleString():'');} return n.toLocaleString(); }
  function total(x){ return x.rent + (x.manage||0); }
  function pyeong(m2){ return m2 ? (m2/3.3058).toFixed(1) : ''; }
  var c = D.cond;

    var xs = filtered();
    var g = document.getElementById('grid'), m = document.getElementById('map');
    g.style.display = st.view==='card' ? '' : 'none';
    m.style.display = st.view==='map' ? 'block' : 'none';
    if(st.view==='card') g.innerHTML = xs.length ? xs.map(card).join('') : '<div class="empty">조건에 맞는 매물이 없습니다.</div>';
    else renderMap(xs);
  }
  document.getElementById('fRec').onclick = function(){ st.onlyRec=!st.onlyRec; save(); render(); };
  document.getElementById('fNew').onclick = function(){ st.onlyNew=!st.onlyNew; save(); render(); };
  document.getElementById('fDrop').onclick = function(){ st.onlyDrop=!st.onlyDrop; save(); render(); };
  document.getElementById('fBig').onclick = function(){ st.onlyBig=!st.onlyBig; save(); render(); };
  document.getElementById('fPet').onclick = function(){ st.onlyPet=!st.onlyPet; save(); render(); };
  document.getElementById('fApt').onclick = function(){ st.onlyApt=!st.onlyApt; save(); render(); };
  document.getElementById('fDaga').onclick = function(){ st.onlyDaga=!st.onlyDaga; save(); render(); };
  document.getElementById('fDase').onclick = function(){ st.onlyDase=!st.onlyDase; save(); render(); };
  document.getElementById('fZz').onclick = function(){ st.onlyZz=!st.onlyZz; st.showHd=false; save(); render(); };
  document.getElementById('fHd').onclick = function(){ st.showHd=!st.showHd; if(st.showHd) st.onlyZz=false; save(); render(); };
  // 카드의 숨기기 / 지도 말풍선의 숨기기: 누르면 바로 목록과 지도에서 빠진다
  document.addEventListener('click', function(e){
    var bt = e.target.closest('.hd, .phd'); if(!bt) return;
    e.preventDefault(); e.stopPropagation();
    toggleHd(bt.getAttribute('data-id'));
    if(map) map.closePopup();
    var keep = map ? map.getBounds() : null;
    render();
    if(keep && st.view==='map') map.fitBounds(keep);  // 숨긴 뒤에도 보던 지도 위치 유지
  });
  document.getElementById('grid').addEventListener('click', function(e){
    var bt = e.target.closest('.zz'); if(!bt) return;
    e.preventDefault(); toggleZz(bt.getAttribute('data-id'));
    if(st.onlyZz){ render(); return; }
    var on = !!ZZ[bt.getAttribute('data-id')]; bt.classList.toggle('on', on); bt.textContent = on ? '♥' : '♡';
  });
  document.getElementById('zzN').textContent = Object.keys(ZZ).length;
  loadZzFile();
  loadHdFile();
  document.addEventListener('click', function(e){
    var bt = e.target.closest('.pzz'); if(!bt) return;
    var id = bt.getAttribute('data-id'); toggleZz(id);
    var on = !!ZZ[id]; bt.classList.toggle('on', on); bt.textContent = on ? '♥ 찜 해제' : '♡ 찜하기';
    document.querySelectorAll('#grid .zz').forEach(function(z){ if(z.getAttribute('data-id')===id){ z.classList.toggle('on', on); z.textContent = on ? '♥' : '♡'; } });
  });
  document.getElementById('sort').onchange = function(e){ st.sort=e.target.value; save(); render(); };
  document.getElementById('vCard').onclick = function(){ st.view='card'; save(); render(); };
  document.getElementById('vMap').onclick = function(){ st.view='map'; save(); render(); };
  render();
  // 켜 둔 동안 뒤에서 새로 수집이 끝나면 알려준다 (1분마다 확인)
  if(location.protocol!=='file:'){
    setInterval(function(){
      fetch('data/data.js?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
        var m = /"updated":\s*"([^"]+)"/.exec(t || '');
        if(m && m[1] !== D.updated && !document.getElementById('freshBar')){
          var b = document.createElement('button');
          b.id = 'freshBar'; b.type = 'button'; b.className = 'fresh-bar';
          b.textContent = '새로 수집한 매물이 들어왔습니다 (' + m[1].slice(5) + ') · 눌러서 새로고침';
          b.onclick = function(){ location.reload(); };
          document.body.appendChild(b);
        }
      }).catch(function(){});
    }, 60000);
  }
})();
</script>
</body>
</html>
